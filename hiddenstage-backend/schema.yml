          type: string
          readOnly: true
        locality:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        venue_name:
          type: string
          readOnly: true
        venue_address:
          type: string
          readOnly: true
