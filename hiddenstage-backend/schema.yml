openapi: 3.0.3
info:
  title: HiddenStage API
  version: 1.0.0
  description: Marketplace API for event requests, provider discovery, invitations,
    quotations and commercial commitments. All monetary values are integer paise (BIGINT).
    Amounts are never floating point.
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Service and database health.
      tags:
      - health
      responses:
        '200':
          description: No response body
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Return and set a CSRF token.
      tags:
      - auth
      responses:
