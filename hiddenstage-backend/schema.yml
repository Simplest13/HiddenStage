          items:
            $ref: '#/components/schemas/ServiceRequirement'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EventAttachment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
