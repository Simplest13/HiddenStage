components:
  schemas:
    AcceptanceRequestRequest:
      type: object
      properties:
        revision_id:
          type: string
          format: uuid
        package_keys:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
        requirement_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - revision_id
    Commitment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          format: uuid
          readOnly: true
        event_name:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          format: uuid
          readOnly: true
        provider_display_name:
          type: string
          readOnly: true
        quotation:
          type: string
          format: uuid
          readOnly: true
        quotation_revision:
          type: integer
          readOnly: true
        status:
          enum:
          - ACTIVE
          - RELEASED
          type: string
          description: |-
            * `ACTIVE` - Active
            * `RELEASED` - Released
          x-spec-enum-id: 52d6c8817244df95
          readOnly: true
        total_paise:
          type: integer
          readOnly: true
          description: Amount in integer paise (INR 1 = 100 paise).
        accepted_at:
          type: string
          format: date-time
          readOnly: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        release_reason:
          type: string
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentLine'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created_at
      - customer
      - event
      - event_date
      - event_name
      - id
      - lines
      - provider
      - provider_display_name
      - quotation
      - quotation_revision
      - release_reason
      - released_at
      - status
      - total_paise
    CommitmentAudit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          enum:
          - ACCEPTED
          - RELEASED
          type: string
          description: |-
            * `ACCEPTED` - Accepted
            * `RELEASED` - Released
          x-spec-enum-id: 1a3c7f7e86401961
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - created_at
      - id
      - note
    CommitmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          format: uuid
          readOnly: true
        event_name:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          format: uuid
          readOnly: true
        provider_display_name:
          type: string
          readOnly: true
        quotation:
          type: string
          format: uuid
          readOnly: true
        quotation_revision:
          type: integer
          readOnly: true
        status:
          enum:
          - ACTIVE
          - RELEASED
          type: string
          description: |-
            * `ACTIVE` - Active
            * `RELEASED` - Released
          x-spec-enum-id: 52d6c8817244df95
          readOnly: true
        total_paise:
          type: integer
          readOnly: true
          description: Amount in integer paise (INR 1 = 100 paise).
        accepted_at:
          type: string
          format: date-time
          readOnly: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        release_reason:
          type: string
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentLine'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        audit_entries:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentAudit'
          readOnly: true
      required:
      - accepted_at
      - audit_entries
      - created_at
      - customer
      - event
      - event_date
      - event_name
      - id
      - lines
      - provider
      - provider_display_name
      - quotation
      - quotation_revision
      - release_reason
      - released_at
      - status
      - total_paise
    CommitmentLine:
