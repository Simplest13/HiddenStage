  /api/v1/providers/:
    get:
      operationId: providers_list
      description: Customer-only discovery of eligible providers. No ranking is inferred.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: city
        schema:
          type: string
          maxLength: 80
      - in: query
        name: pin_code
        schema:
          type: string
          maxLength: 10
      - in: query
        name: state
        schema:
          type: string
          maxLength: 80
      tags:
