          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        requirements:
