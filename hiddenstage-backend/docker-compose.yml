services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiddenstage}
      POSTGRES_USER: ${POSTGRES_USER:-hiddenstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiddenstage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiddenstage} -d ${POSTGRES_DB:-hiddenstage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
